services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: stamp_rally
      POSTGRES_PASSWORD: stamp_rally
      POSTGRES_DB: stamp_rally
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U stamp_rally -d stamp_rally']
      interval: 5s
      timeout: 5s
      retries: 5

  media-worker:
    profiles: ['media']
    build:
      context: .
      dockerfile: apps/api/Dockerfile.worker
    env_file:
      - apps/api/.env
    environment:
      DATABASE_URL: postgresql://stamp_rally:stamp_rally@postgres:5432/stamp_rally?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    restart: unless-stopped
    stop_grace_period: 45s

volumes:
  postgres_data:
